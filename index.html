<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphism Calculator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Inline, because the stylesheet is not applied yet when the first frame is painted (in development it is injected by JavaScript). Used with the inline script at the start of <body>. -->
  <style>html.restoring-mode .app{visibility:hidden}</style>
</head>
<body>
  <!-- Runs before the first paint. A remembered dark appearance is applied at once, so the page never flashes light and fades to dark. A remembered PRO mode hides the calculator until the app has rendered it (CalculatorUI.reveal; 2 s fallback), so the NORMAL layout never shows first. The keys and class names must match UserPreferences, ThemeManager and CalculatorUI (a test checks this). -->
  <script>try{var s=localStorage,h=document.documentElement;if(s.getItem("calculator.appearance")==="dark")document.body.classList.add("theme-pro");if(s.getItem("calculator.mode")==="pro"){h.classList.add("restoring-mode");setTimeout(function(){h.classList.remove("restoring-mode")},2000)}}catch(e){}</script>
  <main class="app">
    <div class="settings" role="group" aria-label="Calculator settings">
      <button type="button" class="mode-toggle" role="switch" aria-checked="false" aria-label="Calculator type: PRO MODE" data-setting="calculator-mode">
        <span class="mode-toggle__label">NORMAL MODE</span>
        <span class="mode-toggle__knob" aria-hidden="true"></span>
      </button>
      <button type="button" class="mode-toggle" role="switch" aria-checked="false" aria-label="Appearance: DARK MODE" data-setting="appearance">
        <span class="mode-toggle__label">LIGHT MODE</span>
        <span class="mode-toggle__knob" aria-hidden="true"></span>
      </button>
    </div>

    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <output class="display__expression" aria-label="Expression" aria-live="off"></output>
        <output class="display__value" aria-live="polite">0</output>
        <span class="display__icon" aria-hidden="true"></span>
      </div>

      <div class="keypad">
        <div class="keypad__row" data-pro-only hidden>
          <button type="button" class="btn btn--function" data-action="open-parenthesis" aria-label="Open parenthesis">(</button>
          <button type="button" class="btn btn--function" data-action="close-parenthesis" aria-label="Close parenthesis">)</button>
          <button type="button" class="btn btn--function" data-action="square" aria-label="Square">x²</button>
          <button type="button" class="btn btn--function" data-action="square-root" aria-label="Square root">√</button>
        </div>

        <div class="keypad__row">
          <button type="button" class="btn btn--function" data-action="clear">AC</button>
          <button type="button" class="btn btn--function" data-action="toggle-sign">+/-</button>
          <button type="button" class="btn btn--function" data-action="percent">%</button>
          <button type="button" class="btn btn--operator" data-operator="divide">÷</button>
        </div>

        <div class="keypad__row">
          <button type="button" class="btn btn--number" data-number="7">7</button>
          <button type="button" class="btn btn--number" data-number="8">8</button>
          <button type="button" class="btn btn--number" data-number="9">9</button>
          <button type="button" class="btn btn--operator" data-operator="multiply">×</button>
        </div>

        <div class="keypad__row">
          <button type="button" class="btn btn--number" data-number="4">4</button>
          <button type="button" class="btn btn--number" data-number="5">5</button>
          <button type="button" class="btn btn--number" data-number="6">6</button>
          <button type="button" class="btn btn--operator" data-operator="subtract">−</button>
        </div>

        <div class="keypad__row">
          <button type="button" class="btn btn--number" data-number="1">1</button>
          <button type="button" class="btn btn--number" data-number="2">2</button>
          <button type="button" class="btn btn--number" data-number="3">3</button>
          <button type="button" class="btn btn--operator" data-operator="add">+</button>
        </div>

        <div class="keypad__row">
          <button type="button" class="btn btn--number btn--wide" data-number="0">0</button>
          <button type="button" class="btn btn--number" data-action="decimal">.</button>
          <button type="button" class="btn btn--equals" data-action="equals">=</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
